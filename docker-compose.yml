services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groceroute
      POSTGRES_PASSWORD: groceroute
      POSTGRES_DB: groceroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groceroute"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    command: python -m groceroute.bot.telegram_bot
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m groceroute.scheduler
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
